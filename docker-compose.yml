services:
    node:
        container_name: e-xode.lejeudelavie
        build:
            context: 'docker/dev'
        volumes:
            - '.:/app'
            - '/app/node_modules'
        ports:
            - 127.0.0.1:3003:3003
        env_file:
            - ./.env
        networks:
            - e-xode
networks:
  e-xode:
    driver: bridge
    external: true
